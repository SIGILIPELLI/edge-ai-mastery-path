site_name: Edge AI Mastery Path
site_description: A structured, module-wise Edge AI & TinyML training program from entry level to master level — train, quantize, and run machine-learning models on your laptop first, then deploy them to microcontrollers and edge devices.
site_url: https://sigilipelli.github.io/edge-ai-mastery-path/
repo_url: https://github.com/SIGILIPELLI/edge-ai-mastery-path
repo_name: edge-ai-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Edge AI": level-1/01-what-is-edge-ai.md
      - "02 · The Edge AI Workflow": level-1/02-edge-ai-workflow.md
      - "03 · Training a Tiny Model": level-1/03-training-a-tiny-model.md
      - "04 · Converting to TFLite/LiteRT": level-1/04-converting-to-tflite.md
      - "05 · Quantization": level-1/05-quantization.md
      - "06 · TFLite-Micro & C Arrays": level-1/06-tflite-micro-c-arrays.md
      - "07 · Deploying to a Microcontroller": level-1/07-deploying-to-microcontroller.md
      - "08 · Sensors & Feature Extraction": level-1/08-sensors-feature-extraction.md
      - "09 · Evaluating & Debugging Edge Models": level-1/09-evaluating-debugging.md
      - "10 · Capstone — Gesture Recognition": level-1/10-capstone-gesture-recognition.md
  - "Level 2 · Intermediate":
